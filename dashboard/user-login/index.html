<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Listings - Sign In</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration for Custom Colors & Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#df1783',
                            pinkHover: '#c21470',
                            bg: '#fafafa',
                            darkBtn: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center p-4 font-sans antialiased text-gray-900">

    <!-- Main Container -->
    <div class="w-full max-w-[400px]">
        
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-4 px-1">
            <!-- Brand & Logo -->
            <div class="flex items-center cursor-pointer group">
                <img 
                    src="https://ik.imagekit.io/bebell/Easy%20Listings/Branding/EasyListings.webp?updatedAt=1793038323330" 
                    alt="Easy Listings Logo" 
                    class="w-7 h-7 object-contain mr-2 group-hover:scale-105 transition-transform duration-300"
                    onerror="this.src='https://placehold.co/32x32/df1783/ffffff?text=EL'"
                >
                <span class="text-[22px] font-extrabold tracking-tight text-gray-900">Easy<span class="text-brand-pink">Listings</span></span>
            </div>

            <!-- Language Toggle -->
            <div class="flex items-center">
                <button class="text-gray-500 font-bold text-xs mr-3 hover:text-gray-900 transition-colors duration-200">
                    ES
                </button>
                <button class="bg-brand-darkBtn text-white px-2 py-1 rounded text-xs font-bold shadow hover:scale-105 transition-transform duration-200">
                    EN
                </button>
            </div>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-[0_2px_10px_rgba(0,0,0,0.02)] p-6 sm:p-8">
            <h1 class="text-[22px] font-bold text-gray-900 mb-6">Sign in</h1>

            <form onsubmit="event.preventDefault();" class="space-y-4">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm text-gray-600 mb-1.5">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 outline-none focus:border-brand-pink focus:ring-1 focus:ring-brand-pink transition-all duration-200"
                        placeholder=""
                        required
                    >
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm text-gray-600 mb-1.5">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 outline-none focus:border-brand-pink focus:ring-1 focus:ring-brand-pink transition-all duration-200"
                        placeholder=""
                        required
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full mt-6 bg-brand-pink text-white font-bold py-3 rounded-lg shadow-sm hover:bg-brand-pinkHover hover:-translate-y-0.5 hover:shadow-md active:scale-[0.98] transition-all duration-200"
                >
                    Sign in
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-6 text-center text-sm text-gray-600">
                New to Easy Listings? 
                <a href="#" class="text-brand-pink font-bold hover:underline hover:text-brand-pinkHover transition-colors duration-200">
                    Create your catalog
                </a>
            </div>
        </div>

    </div>

</body>
</html>
